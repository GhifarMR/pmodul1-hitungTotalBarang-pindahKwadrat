name: Java CI with Maven

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: 
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    # PERBAIKAN: Robot masuk dan melakukan build ke kedua folder secara bergantian
    - name: Build with Ant
      run: |
        echo "Building pmodul1..."
        cd pmodul1 && ant compile jar
        cd ..
        echo "Building PindahKwadrat..."
        cd PindahKwadrat && ant compile jar

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          pmodul1/dist/*.jar
          PindahKwadrat/dist/*.jar
